name: Publish to MCP Registry

# Publishes every servers/*/server.json whose version is not in the registry yet.
# Auth is GitHub OIDC, so no secret is stored anywhere.
on:
  push:
    branches: [main]
    paths:
      - "servers/**/server.json"
      - ".github/workflows/publish-mcp.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
      REGISTRY: https://registry.modelcontextprotocol.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate every listing
        run: |
          set -euo pipefail
          for f in servers/*/server.json; do ./mcp-publisher validate "$f"; done

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish versions the registry does not have yet
        run: |
          set -euo pipefail
          for f in servers/*/server.json; do
            name="$(jq -r .name "$f")"
            version="$(jq -r .version "$f")"
            encoded="$(jq -rn --arg n "$name" '$n|@uri')"
            code="$(curl -s -o /dev/null -w '%{http_code}' "$REGISTRY/v0.1/servers/$encoded/versions/$version")"
            if [ "$code" = "200" ]; then
              echo "skip $name $version (already published)"
              continue
            fi
            echo "publish $name $version"
            ./mcp-publisher publish "$f"
          done
